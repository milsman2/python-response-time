name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  # mise.toml is the single source of truth for tool versions; CI reads it
  # here instead of relying on GH Actions variables that can silently drift.
  versions:
    runs-on: ubuntu-latest
    outputs:
      python_version: ${{ steps.versions.outputs.python_version }}
      uv_version: ${{ steps.versions.outputs.uv_version }}
    steps:
      - uses: actions/checkout@v5
      - id: versions
        run: |
          echo "python_version=$(awk -F'\"' '/^python/{print $2}' mise.toml)" >> "$GITHUB_OUTPUT"
          echo "uv_version=$(awk -F'\"' '/^uv/{print $2}' mise.toml)" >> "$GITHUB_OUTPUT"
  cache:
    needs: versions
    uses: milsman2/python-app-template/.github/workflows/cache-uv-build.yaml@v1.19.1
    with:
      UV_VERSION: ${{ needs.versions.outputs.uv_version }}
      PYTHON_VERSION: ${{ needs.versions.outputs.python_version }}
  lint:
    uses: milsman2/python-app-template/.github/workflows/ruff.yaml@v1.19.1
    needs: [versions, cache]
    with:
      UV_VERSION: ${{ needs.versions.outputs.uv_version }}
      PYTHON_VERSION: ${{ needs.versions.outputs.python_version }}
  test:
    needs: [versions, lint, cache]
    uses: milsman2/python-app-template/.github/workflows/pytest.yaml@v1.19.1
    with:
      UV_VERSION: ${{ needs.versions.outputs.uv_version }}
      PYTHON_VERSION: ${{ needs.versions.outputs.python_version }}
  docker-build-and-image-scan:
    if: github.event_name == 'push'
    needs: test
    uses: milsman2/python-app-template/.github/workflows/docker-build-and-scan.yaml@v1.19.1
    with:
      DOCKER_PATH_CONTEXT: .
      DOCKER_BUILD_DOCKERFILE: ./Dockerfile
      DOCKER_TAGS: ${{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_REPOSITORY }}:${{ github.sha }}
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
    secrets: inherit
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [versions, test, docker-build-and-image-scan]
    uses: milsman2/python-app-template/.github/workflows/release.yaml@v1.19.1
    permissions:
      contents: write
    secrets: inherit
    with:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
      UV_VERSION: ${{ needs.versions.outputs.uv_version }}
      PYTHON_VERSION: ${{ needs.versions.outputs.python_version }}
      DOCKER_PATH_CONTEXT: .
      DOCKER_BUILD_DOCKERFILE: ./Dockerfile

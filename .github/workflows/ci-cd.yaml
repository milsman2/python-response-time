name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  ci-cd:
    uses: milsman2/python-app-template/.github/workflows/ci-cd.yaml@v1.19.6
    permissions:
      contents: write
    with:
      UV_VERSION: '0.12.7'
      PYTHON_VERSION: '3.13'
    secrets: inherit
